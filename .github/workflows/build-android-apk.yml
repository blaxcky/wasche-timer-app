name: Build Android APK

on:
  push:
    branches: ["Overhaul"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 2.0.${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waesche-timer-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/waesche-timer-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: npm run android:release

      - name: Name release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/waesche-timer-${ANDROID_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: waesche-timer-${{ env.ANDROID_VERSION_NAME }}
          path: android/app/build/outputs/apk/release/waesche-timer-${{ env.ANDROID_VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${ANDROID_VERSION_NAME}"
          release_apk="android/app/build/outputs/apk/release/waesche-timer-${ANDROID_VERSION_NAME}.apk"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$release_apk" --clobber
          else
            gh release create "$release_tag" "$release_apk" --target "$GITHUB_SHA" --title "Wäsche-Timer ${ANDROID_VERSION_NAME}" --notes "Automatisch erstellte Android-Version aus dem Branch Overhaul."
          fi
